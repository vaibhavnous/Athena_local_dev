[pytest]
testpaths = tests
# ponytail: Windows ACLs leave unreadable pytest cache temp dirs here; remove if tests need pytest's cache fixture or --lf/--ff.
addopts = -p no:cacheprovider
norecursedirs =
    .*
    __pycache__
    .pytest_cache
    pytest-cache-files-*
    .tmp-tests
    generated_code
    uploads
    node_modules
    build
    dist
